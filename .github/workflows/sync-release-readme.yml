name: Release Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    name: Audit dependencies and latest stable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: pnpm audit --registry=https://registry.npmjs.org --audit-level moderate
      - name: Re-download and verify the stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          version="${tag#v}"
          name="xungen-${version}.tar.gz"
          dir="$(mktemp -d)"
          gh release download "$tag" --pattern "$name" --pattern "$name.sha256" \
            --pattern "xungen-${version}.update.json" --dir "$dir"
          node scripts/release-assets.mjs verify "$tag" "$dir"
          grep -Fq -- "## [$version]" CHANGELOG.md
          gh attestation verify "$dir/$name" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
