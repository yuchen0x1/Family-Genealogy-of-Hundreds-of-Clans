allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

# next 15.x 固定依赖 postcss 8.4.31，该版本存在 sourceMappingURL 任意文件读取
# 与 </style> 未转义两项 high 漏洞。上游 15.x 未跟进，此处强制统一到已修复的
# 8.5.x（postcss 同主版本内向后兼容）。升 next 16 或等官方跟进后可移除。
#
# deepmerge-ts：@prisma/config@6 依赖 ^7，7.x 存在 CVE-2026-40345（递归对象合并
# 栈耗尽）。8.x 已修复且保留 CJS 入口，此处跨主版本收口。等 prisma 稳定版跟进后可移除。
#
# minimatch：CVE-2026-118764（glob 模式放大 DoS，GHSA-g3hv-75wg-m249），影响
# >=7.0.0 <11.0.1。这里按「漏洞区间」精确收口到 11.0.1，而不是全局 override：
# @eslint/eslintrc@3.3.7 依赖 ^3.1.5 且使用 `import minimatch from "minimatch"`
# 默认导入，而 minimatch 11 只有命名导出——全局 override 会把 3.1.5 一起顶掉，
# 导致 eslint 启动即抛 SyntaxError: does not provide an export named 'default'。
# 区间收口后 3.1.5 保持不动，实际被替换的只有 glob@10（→9.x）与
# @typescript-eslint/typescript-estree（→10.x）两条开发期链路。
# 两者都用命名导入（Minimatch/GLOBSTAR/escape/unescape/minimatch），
# 且 11.x 仍提供 CJS require 入口，实测 lint/typecheck/test/build 全通过。
# 等上游升到 minimatch 11 后可移除本条。
overrides:
  postcss: ^8.5.32
  deepmerge-ts: ^8.0.2
  "minimatch@>=7.0.0 <11.0.1": 11.0.1
