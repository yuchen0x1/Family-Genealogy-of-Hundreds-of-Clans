name: xungen

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xungen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD（生产强密码）}
      POSTGRES_DB: ${POSTGRES_DB:-xungen}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xungen} -d ${POSTGRES_DB:-xungen}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # 不向宿主机暴露 5432；运维可从容器内或跳板机访问

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # 容器内地址必须覆盖 .env 中的 127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-xungen}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-xungen}?schema=public
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
      UPLOAD_DIR: /app/.storage/uploads
      BACKUP_DIR: /app/backups
      STORAGE_DRIVER: local
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://localhost}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置随机 SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 中设置 32 字节 hex ENCRYPTION_KEY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      APP_UPDATE_DRIVER: ${APP_UPDATE_DRIVER:-DOCKER}
      APP_UPDATE_REPO: ${APP_UPDATE_REPO:-}
    volumes:
      - uploads:/app/.storage/uploads
      - update_state:/app/.storage/update
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # 仅 updater 持有 Docker socket；app/nginx 永远不挂载该 socket。
  updater:
    image: docker:27.5.1-cli
    restart: unless-stopped
    environment:
      APP_UPDATE_PROJECT_DIR: ${APP_UPDATE_PROJECT_DIR:?请在 .env 中设置宿主机项目绝对路径（如 /srv/xungen）}
      APP_UPDATE_POLL_SECONDS: ${APP_UPDATE_POLL_SECONDS:-15}
      APP_UPDATE_UPDATE_DIR: /app/.storage/update
    volumes:
      # 宿主机目录仅提供 .env 与 Compose 项目配置；新版源码从 update_state 共享卷构建。
      - ${APP_UPDATE_PROJECT_DIR:?请在 .env 中设置宿主机项目绝对路径（如 /srv/xungen）}:${APP_UPDATE_PROJECT_DIR:?请在 .env 中设置宿主机项目绝对路径（如 /srv/xungen）}:ro
      - update_state:/app/.storage/update
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/update-sidecar.sh:/usr/local/bin/update-sidecar.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/update-sidecar.sh"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/local/bin/update-sidecar.sh"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
  update_state:
