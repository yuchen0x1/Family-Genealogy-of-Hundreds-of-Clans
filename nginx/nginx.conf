# 生产反向代理示例：TLS 终止 + 静态加速 + 强制覆盖来源 IP 头。
# 证书路径：./nginx/certs/fullchain.pem 与 privkey.pem
# 本地演练可用 `bash nginx/generate-dev-cert.sh` 生成自签证书；生产必须替换为真实证书。

upstream xungen_app {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 预留 ACME HTTP-01 校验目录（若使用 certbot 自动续期）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # MAX_UPLOAD_MB=20，multipart 有额外开销，留 5MB 余量
    client_max_body_size 25m;
    client_body_timeout  60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/health {
        access_log off;
        proxy_pass http://xungen_app;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://xungen_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection       "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 安全关键：必须【覆盖】而不是追加客户端传来的 X-Forwarded-For。
        # 应用只有在 TRUST_PROXY=true 时才读取该头；若这里写成
        # $proxy_add_x_forwarded_for，攻击者可伪造任意 IP 绕过注册/登录限流。
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Real-IP        $remote_addr;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }
}
